<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="THE LAST KEY — 키보드의 키가 한정된 자원인 퍼즐 플랫포머. EVERY ACTION HAS A COST.">
  <meta name="theme-color" content="#050506">
  <title>THE LAST KEY</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main id="app">
    <div id="screen">
      <canvas id="game" width="480" height="272" aria-label="게임 화면"></canvas>
      <div id="hud" class="hidden">
        <span id="hud-stage"></span>
        <span id="hud-keys"></span>
      </div>
      <div id="message" class="hidden" aria-live="polite"></div>
      <div id="overlay"></div>
    </div>
    <div id="keyboard" aria-label="키보드 상태"></div>
    <div id="legend"></div>
  </main>

  <noscript>이 게임을 실행하려면 JavaScript가 필요합니다.</noscript>

  <!-- 순서 중요: 공용 상수 → 데이터/로직 → 화면 → 시작점 -->
  <script src="js/constants.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/input.js"></script>
  <script src="js/key-system.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
